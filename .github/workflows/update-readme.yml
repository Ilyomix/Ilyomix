name: Update profile

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - ".github/workflows/update-readme.yml"
  workflow_dispatch:

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update age and experience
        run: |
          BIRTH="1994-04-12"
          CAREER_START="2017-09-01"
          TODAY=$(date -u +%Y-%m-%d)

          # Calculate age
          birth_y=${BIRTH%%-*}
          birth_md=${BIRTH#*-}
          today_y=${TODAY%%-*}
          today_md=${TODAY#*-}
          age=$((today_y - birth_y))
          if [[ "$today_md" < "$birth_md" ]]; then
            age=$((age - 1))
          fi

          # Calculate years of experience
          career_y=${CAREER_START%%-*}
          career_md=${CAREER_START#*-}
          xp=$((today_y - career_y))
          if [[ "$today_md" < "$career_md" ]]; then
            xp=$((xp - 1))
          fi

          # Replace in README
          sed -i "s/<!--AGE_START-->.*<!--AGE_END-->/<!--AGE_START-->${age}<!--AGE_END-->/" README.md
          sed -i "s/<!--XP_START-->.*<!--XP_END-->/<!--XP_START-->${xp}+<!--XP_END-->/" README.md

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&theme=transparent&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&size_weight=0.5&count_weight=0.5&exclude_repo=Ilyomix&theme=transparent&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit profile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update profile data"
            git push
          fi
