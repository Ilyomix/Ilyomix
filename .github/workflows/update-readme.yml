name: Update profile

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - ".github/workflows/update-readme.yml"
      - "profile/build.py"
  workflow_dispatch:

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # If GitHub refuses the query, the panel keeps yesterday's numbers.
      - name: Refresh GitHub stats
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 profile/build.py stats

      - name: Rebuild LED panels
        run: python3 profile/build.py

      - name: Commit profile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg profile/github.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update profile data"
            git pull --rebase
            git push
          fi
